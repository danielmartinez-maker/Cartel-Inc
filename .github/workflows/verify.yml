name: Verify campaign
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:balance
      - run: npm run build
